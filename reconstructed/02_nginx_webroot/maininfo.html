<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Safe Watch - 정보</title><link rel="stylesheet" href="assets/style.css"></head><body>
<main style="padding:8px"><div id="status" class="status">
   <div class="metric"><small>구역</small><b>명지대학교 골목 1</b></div>
   <div class="metric"><small>현재시각</small><b id="time">—</b></div>
   <div class="metric"><small>인원 / 밀집도</small><b><span id="people">—</span> / <span id="density">—</span></b></div>
   <div class="metric risk"><small>위험 수준</small><b id="level">—</b></div>
</div><p class="details">측정 시각: <span id="measured">—</span> <span id="error"></span></p>
<div id="danger-notice" class="notice hidden" role="alert">위험 수준 감지</div>
<button id="enable-audio" type="button">브라우저 경고음 켜기</button><audio id="alarm-audio" src="warning.wav"></audio>
</main><script src="assets/dashboard.js"></script></body></html>
