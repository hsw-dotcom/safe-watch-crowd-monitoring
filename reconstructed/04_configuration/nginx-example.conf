# [NEW / NOT ORIGINAL] Example only; PHP-FPM socket/path differs by OS version.
server {
    listen 80;
    server_name _;
    root /var/www/html;
    index index.html;
    location / { try_files $uri $uri/ =404; }
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        # IMPORTANT: set env vars in the actual PHP-FPM pool; see deployment guide.
    }
    location ~ /\. { deny all; }
    location ~* \.(ini|sql|md|log)$ { deny all; }
}
