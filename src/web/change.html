<!DOCTYPE html>
<html>
<head>
  <title>그래프</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <canvas id="myChart" height="200px"></canvas>

  <script>
    const ctx = document.getElementById('myChart').getContext('2d');
    const myChart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [{
          label: '밀집도 변화율 (%p)',
          data: [],
          backgroundColor: 'rgba(255, 99, 132, 0.2)',
          borderColor: 'rgba(255, 99, 132, 1)',
          borderWidth: 3
        }]
      },
      options: {
        scales: {
          y: {
            beginAtZero: true
          }
        }
      }
    });

    // 데이터베이스에서 데이터 가져와서 그래프 업데이트
function updateChart() {
  // PHP 파일로부터 데이터 가져오기
  fetch('changeinfo.php')
    .then(response => response.json())
    .then(data => {
      const labels = data.map(item => item.time_label);
      const values = data.map(item => item.change_rate);

      // 그래프 데이터 업데이트
      myChart.data.labels = labels;
      myChart.data.datasets[0].data = values;
      myChart.update();
    });
}

// 페이지 로드 시 그래프 업데이트
updateChart();

// 일정 시간마다 그래프 업데이트
setInterval(updateChart, 1000); // 1초(5000밀리초)마다 그래프 업데이트

  </script>
</body>
</html>
