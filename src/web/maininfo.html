
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Safe Watch - 정보</title>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #888;
      margin: 0;
    }
    
    #header {
      text-align: center;
      padding: 10px;
      font-size: 20px;
    }

 h1 {
      margin: 0;
    }

    #content {
      padding: 20px;
      text-align: center;
    }
.modal {
    display: none; /* 모달 초기에는 숨김 상태로 설정 */
    position: fixed; /* 고정 위치 */
    z-index: 1; /* 다른 요소 위에 표시하기 위한 우선순위 설정 */
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto; /* 모달이 화면 크기를 벗어나면 스크롤 가능하도록 설정 */
    background-color: rgba(0, 0, 0, 0.5); /* 반투명한 배경 설정 */

  }

  .modal-content {
    background-color: #fefefe;
    margin: 20px auto 0; /* 모달이 상단에 표시되도록 설정 */
    padding: 20px;
    border: 1px solid #888;
    width: 80%;
    max-width: 500px;
    text-align: center;
    position: relative;


  }

  .close {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    position: absolute;
    top: 10px;
    right: 20px;
    cursor: pointer;
  }

  .close:hover,
  .close:focus {
    color: black;
    text-decoration: none;
    cursor: pointer;
  }

    @media screen and (min-width:1200px) {
      p {
        font-size: 24px;
        font-weight: bold;
        margin: 10px;
      }
      p0 {
        font-size: 18px;
        font-weight: bold;
        margin: 4px;
      }
   }

    @media screen and (min-width:600px) and (max-width:1199px) {
      p {
        font-size: 22px;
        font-weight: bold;
        margin: 8px;
      }
      p0 {
        font-size: 16px;
        font-weight: bold;
        margin: 3px;
      }

   }

    @media screen and (max-width:599px) {
      p {
        font-size: 20px;
        font-weight: bold;
        margin: 4px;
      }
      p0 {
        font-size: 14px;
        font-weight: bold;
        margin: 2px;
      }
    }

    .info {
      margin-top: 20px;
    }

    .container {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .info1-column {
     width: 20%; 
    }
    .info2-column {
     width: 20%; 
    }
    .info3-column {
     width: 20%; 
    }
    .info4-column {
     width: 20%; 
    }
    .low-risk {
      background-color: #00cc00;
    }
    .medium-risk {
      background-color: yellow;
    }
    .high-risk {
      background-color: red;
    }


  </style>
</head>

<body onload="updateClock(); setInterval('updateClock()', 1000 )">
  <div id="header"></div>

    <div class="info-column" id="infoColumn">
  <div class="container">
      <div class="info1-column">
        <p class="info">구역</p>
        <p class="info">명지<br>대학교<br>골목 1</p>
      </div>
      <div class="info2-column">
        <p class="info">현재<br>시각</p>
        <p id="currentTime"></p>
      </div>
      <div class="info3-column">
        <p class="info">군중<br>밀집도</p>
        <p><span id="crowdDensity"></span></p>
      </div>
      <div class="info4-column">
        <p class="info">위험<br>수준</p>
        <p><span id="dangerLevel"></span></p>
      </div>
    </div>
  </div>
</div> 
<div id="myModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div id="modalMessage"></div>
    </div>
  </div>

<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.1/moment.min.js"></script>


 <script type="text/javascript">
    function updateClock() {
      var currentTime = new Date();
      var hours = currentTime.getHours();
      var minutes = currentTime.getMinutes();
      var seconds = currentTime.getSeconds();

      // 시간, 분, 초가 한자리 수인 경우 앞에 0을 붙여줌
      if (hours < 10) {
        hours = "0" + hours;
      }
      if (minutes < 10) {
        minutes = "0" + minutes;
      }
      if (seconds < 10) {
        seconds = "0" + seconds;
      }

      // 현재시각을 문자열로 구성하여 HTML에 출력
      var currentTimeString = hours + ":" + minutes + ":" + seconds;
      document.getElementById("currentTime").innerHTML = currentTimeString;
    }

    // 데이터를 가져올 PHP 파일의 URL
    var dataUrl = "maininfo.php";

    // AJAX 요청 함수 정의
    function fetchData() {
      // AJAX 요청 생성
      var request = new XMLHttpRequest();
      request.open("GET", dataUrl, true);

      // 요청 완료 시 처리할 함수
      request.onload = function () {
        if (request.status >= 200 && request.status < 400) {
          // 요청이 성공한 경우 JSON 데이터를 가져옴
          var data = JSON.parse(request.responseText);

          // 가져온 데이터에서 밀집도와 위험 수준 추출
          var crowdDensity = data[0]["crowd_density"];
          var dangerLevel = data[0]["danger_level"];

          // 위험 단계에 따라 페이지 색상 업데이트
           var infoColumnElement = document.querySelector(".info-column");
           infoColumnElement.classList.remove("low-risk", "medium-risk", "high-risk");
           infoColumnElement.classList.add(getDangerLevelClass(dangerLevel));
          // HTML 엘리먼트에 값을 업데이트
          document.getElementById("crowdDensity").textContent = crowdDensity;
          document.getElementById("dangerLevel").textContent = dangerLevel;
        }
      };

      // 요청 실패 시 처리할 함수
      request.onerror = function () {
        // 요청이 실패한 경우 에러 메시지 출력
        console.error("데이터를 가져오는 데 실패했습니다.");
      };

      // 요청 전송
      request.send();
    }

    function getDangerLevelClass(dangerLevel) {
  switch (dangerLevel) {
    case "위험":
      {
         openModal("위험 수준이 감지되었습니다!");
      }
         return "high-risk";
    case "경고":
      return "medium-risk";
    default:
      return "low-risk";
  }
}
function openModal(message) {
  var modal = document.getElementById("myModal");
  var modalMessage = document.getElementById("modalMessage");
  var closeBtn = document.getElementsByClassName("close")[0];

  // 모달창에 메시지 설정
  modalMessage.innerHTML = message;

  // 모달창 열기
  modal.style.display = "block";

  // 닫기 버튼 클릭 시 모달창 닫기
  closeBtn.onclick = function () {
    modal.style.display = "none";
  };
 // 모달 창 밖 클릭 시 모달창 닫기
  window.onclick = function (event) {
    if (event.target == modal) {
      modal.style.display = "none";
    }
  };
  // 모달 창 열린 후 5초 후에 모달 창 숨김
  setTimeout(function() {
    modal.style.display = "none";
  }, 5000);
}   


 // 초기 데이터 가져오기
    fetchData();

    // 페이지 자동 새로고침 함수 정의
    function refreshPage() {
      // 데이터 가져오기
      fetchData();

      // 페이지 새로고침
      location.reload();
    }

    // 일정 시간마다 페이지 자동 새로고침
    setInterval(refreshPage, 10000); // 10초마다 새로고침


  </script>


</body>
</html>
