<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Safe Watch - 밀집도 그래프</title>
  <link rel="stylesheet" href="assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header><h1>Safe Watch · 밀집도 그래프</h1><p>2023 캡스톤 코드 재구성</p></header>
  <main>
    <p id="demo-label" class="details" hidden>예시 데이터입니다. 실제 측정 결과가 아닙니다.</p>
    <div class="cameras">
      <section class="panel"><h2>군중 밀집도</h2><div class="chartbox"><canvas id="density-chart"></canvas></div></section>
      <section class="panel"><h2>밀집도 변화율 (%)</h2><div class="chartbox"><canvas id="change-chart"></canvas></div></section>
    </div>
    <p id="chart-error" class="details" aria-live="polite"></p>
    <div class="menu"><a id="home-link" href="index.html">메인 페이지로 돌아가기</a></div>
  </main>
  <script src="assets/chart.js"></script>
</body></html>
