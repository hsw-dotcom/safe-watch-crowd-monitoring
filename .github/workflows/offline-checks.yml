name: Source syntax checks
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile-check archived Python source (no import or hardware)
        run: python3 -m compileall -q src/python
      - name: PHP syntax check (if PHP CLI is present)
        run: |
          if command -v php >/dev/null 2>&1; then
            find src/web -name '*.php' -print0 | xargs -0 -r -n1 php -l
          else
            echo 'PHP CLI unavailable: PHP check skipped'
          fi
